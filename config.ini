[FAA]
search_url = https://notams.aim.faa.gov/notamSearch/search
index_url = https://notams.aim.faa.gov/notamSearch/nsapp.html
freeform_terms = AEROSPACE,AER0SPACE,DNG ZONE
timeout = 7
retries = 2
max_workers = 2
max_pages = 100

[DAIP]
query_url = https://www.daip.jcs.mil/daip/mobile/query
index_url = https://www.daip.jcs.mil/daip/mobile/index
timeout = 15
# DAIP 当前证书链通常不在 Python/Certifi 默认信任库中；如已安装对应 CA，可改为 true。
verify_ssl = false
radius = 10
sort = Criticality

#本地服务器配置
[SERVER]
host = 127.0.0.1
port = 5000
auto_open_browser = false

[MAIL]
enabled = true
smtp_server = smtp.qq.com
smtp_port = 465
smtp_user =
smtp_auth_code =
from_email =
from_name = NOTAM Bot
to_emails =
