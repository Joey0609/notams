# 数据源选择：faa、daip、dins、msi、uscg。多个数据源使用逗号分隔，按顺序聚合和去重。
[DATA_SOURCES]
enabled = daip, msi, uscg

[USCG]
# USCG NAVCEN Local Notice to Mariners（NOTMAR）实时 GeoJSON 目录。
base_url = https://navcen.uscg.gov/sites/default/files/msi
timeout = 20
max_workers = 8

# FIR/ICAO配置，填写需要获取航警的飞行情报区（FIR）代码或机场ICAO代码。
[ICAO_FOCUSED]
codes = ZBPE ZGZU ZHWH ZJSA ZLHW ZPKM ZSHA ZWUQ ZYSH VVTS WSJC WIIF YMMM WMFC RPHI AYPM AGGG NFFF KZAK VYYF VCCF VOMF WAAF RJJJ RCAA YBBB VVGL VVHN VVHM RCSP WIIF

[ICAO]
