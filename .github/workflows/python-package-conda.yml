name: Update NOTAM and Deploy to Pages

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "*/15 * * * *" 
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-notam:
    runs-on: ubuntu-latest
    outputs:
      has_generated_changes: ${{ steps.commit.outputs.has_generated_changes }}
    env:
      NOTAM_SMTP_USER: ${{ secrets.NOTAM_SMTP_USER }}
      NOTAM_SMTP_AUTH_CODE: ${{ secrets.NOTAM_SMTP_AUTH_CODE }}
      NOTAM_FROM_EMAIL: ${{ secrets.NOTAM_FROM_EMAIL }}
      NOTAM_TO_EMAILS: ${{ secrets.NOTAM_TO_EMAILS }}
      QQ_BOT_SERVER_IP: ${{ secrets.QQ_BOT_SERVER_IP }}
      QQ_BOT_SERVER_PORT: ${{ secrets.QQ_BOT_SERVER_PORT }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Update NOTAM list
        run: |
          python3 main.py

      - name: Commit and push changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --staged --quiet; then
            echo "has_generated_changes=false" >> "$GITHUB_OUTPUT"
            echo "No generated changes; skip commit and Pages deployment."
            exit 0
          fi
          echo "has_generated_changes=true" >> "$GITHUB_OUTPUT"
          git commit -m "Auto update NOTAM list"
          git push

  deploy:
    needs: update-notam
    # 定时/手动抓取仅在 main.py 实际写入文件后部署；用户手动 push 仍可部署站点代码。
    if: needs.update-notam.outputs.has_generated_changes == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # update-notam 可能刚刚提交数据；部署必须读取远端 main 的最新提交。
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
