name: Update NOTAM

on:
  push:
    branches: ["main"]
  # schedule:
    # - cron: "*/15 * * * *"
  workflow_dispatch:

# Pages is published by the repository's branch-based GitHub Pages build.
# This workflow only updates and pushes data, so a data commit triggers one Pages deployment.
permissions:
  contents: write

# Prevent overlapping fetch/update jobs from racing to push generated data.
concurrency:
  group: "notam-update"
  cancel-in-progress: false

jobs:
  update-notam:
    runs-on: ubuntu-latest
    env:
      NOTAM_SMTP_USER: ${{ secrets.NOTAM_SMTP_USER }}
      NOTAM_SMTP_AUTH_CODE: ${{ secrets.NOTAM_SMTP_AUTH_CODE }}
      NOTAM_FROM_EMAIL: ${{ secrets.NOTAM_FROM_EMAIL }}
      NOTAM_TO_EMAILS: ${{ secrets.NOTAM_TO_EMAILS }}
      QQ_BOT_SERVER_IP: ${{ secrets.QQ_BOT_SERVER_IP }}
      QQ_BOT_SERVER_PORT: ${{ secrets.QQ_BOT_SERVER_PORT }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Update NOTAM list
        run: python3 main.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --staged --quiet; then
            echo "No generated changes; skip commit."
            exit 0
          fi
          git commit -m "Auto update NOTAM list"
          git push
